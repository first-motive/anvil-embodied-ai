# Every controller that runs on the robot also runs in fm-sim: each robot launch in
# classical_control publishes a control descriptor, and each descriptor has a sim
# catalog entry (ros2/src/classical_control/test/test_controller_parity.py). The test
# reads the source tree only, so it needs Python and pyyaml, not a ROS build.
name: controller-parity

on:
  push:
    branches: ["main"]
    paths: ["ros2/src/classical_control/**", ".github/workflows/controller-parity.yml"]
  pull_request:
    paths: ["ros2/src/classical_control/**", ".github/workflows/controller-parity.yml"]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Robot and sim controllers match
        run: uvx --with pyyaml==6.0.3 pytest==9.2.0 ros2/src/classical_control/test/test_controller_parity.py
