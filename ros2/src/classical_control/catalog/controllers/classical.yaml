# Catalog entry (fm_sim.controllers): the classical look-then-move baseline. Its sim
# launch starts task_node on the pose interface plus fm-sim's EE follower, which streams
# the right arm's forward position controller. Listed but refused until the sim can
# localise and grasp: nothing publishes /classical/can_pose or /classical/paper_pose
# in sim, the pose interface sends no gripper command, and no run sends a pick_place goal.
name: classical
description: >-
  Classical look-then-move can pick and place through the EE follower.
  Not available: no sim source for the can and paper poses, no gripper command on the
  pose interface, and nothing sends the pick_place goal
available: false
activate: [arm_forward_position]
launch:
  package: classical_control
  path: launch/sim.launch.py
