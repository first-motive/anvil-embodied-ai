# Object config for the collection loop (collect_node --object box). Same shape as
# can.yaml; see there for what each field means.
#
# A cardboard box 4.5 cm tall with a 7 x 14 cm footprint, measured 2026-11-09. Grasp it
# across the 7 cm face, the same width as the can, so the demos' grasp fits. Perception
# publishes no yaw, so place it with that face towards the demos' grasp direction.

# Height of the upright object, in metres. The perception node's can_height is set to this
# at the start of a run; the blob centroid is placed on the plane table_z + height_m / 2.
height_m: 0.045

knobs:
  # The demos close the fingers level with the can top, 0.341 m, and task.yaml's
  # grasp_height_offset_m brings that 3.5 cm down the can body, 9.9 cm above the table.
  # A 4.5 cm box needs the fingers about 2.4 cm above the table, so a fixed further
  # 7.5 cm down: TCP 0.231 m, 1.4 cm above task.yaml's floor (table_z + z_margin_m).
  # At -0.07 the fingers skimmed the top: 2 of 7 attempts held (fm-rob-01, 2026-11-09).
  # Place moves with it, so the box lands on the paper. Needs max_grasp_dz_m >= 0.07
  # in task.yaml, or the task node clamps it back and the gripper closes above the box.
  grasp_dz_m: [-0.075, -0.075]
  # Fully closed: a 7 cm face reads a little above the can's 0.0185 m, well clear of
  # the missed-grasp threshold.
  closure_m: [0.0, 0.0]
  # The demos' grasp yaw suits a round can; on the box it closed about 20 degrees
  # anticlockwise of square (seen from above, fm-rob-01, 2026-11-09). Rotation is
  # about world z, right-handed, so clockwise is negative. -0.35 rad is the cap
  # (task.yaml max_yaw_offset_rad); if it gets worse the sign is wrong.
  yaw_offset_rad: [-0.35, -0.35]
