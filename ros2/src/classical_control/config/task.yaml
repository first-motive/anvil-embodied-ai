# ROS parameters for task_node: the /classical/pick_place action server.
# Load with: ros2 run classical_control task_node --ros-args --params-file <this file>
# All poses and boxes are in the `world` frame, metres and radians.
/**:
  ros__parameters:
    # mined_params.yaml written by episode_miner (grasp_z, place_z, grasp orientation).
    # Required: there is no safe built-in grasp height. "~" is expanded.
    mined_params_file: ""

    # Frame stamped on /commanded_ee_right; the robot IK expects world.
    frame_id: "world"

    # Command streaming rate in Hz. Trajectories are sampled at this rate, one sample per tick.
    control_rate_hz: 30.0

    # --- Safety (safety.SafetyLimits). /commanded_ee_right bypasses every upstream limiter,
    # so these clamps are the only software guard besides the webapp e-stop. ---

    # Allowed TCP box. Conservative box around the table region in front of the right arm;
    # every planned waypoint must lie inside it or the goal fails with OUT_OF_WORKSPACE.
    workspace_min_m: [0.05, -0.55, 0.0]
    workspace_max_m: [0.65, 0.15, 0.70]

    # Table surface height: tape-measured from the bottom of the body base plate (the
    # follower_body_link0 origin) to the table top, 206-208 mm, on 2026-10-01. Must match
    # perception.yaml. The TCP floor is table_z + z_margin_m.
    table_z: 0.207
    # Clearance kept between TCP and table, in metres.
    z_margin_m: 0.01

    # Largest step allowed between two commands. 5 mm at 30 Hz is 0.15 m/s, above v_max_mps,
    # so it only binds if the planner misbehaves.
    max_position_step_m: 0.005
    # Largest rotation between two commands. 0.05 rad at 30 Hz is 1.5 rad/s, above w_max_radps.
    max_rotation_step_rad: 0.05

    # Finger range the gripper command is clamped into (closed, open).
    gripper_min_m: 0.0
    gripper_max_m: 0.05

    # --- Motion ---

    # Peak linear speed at speed_scale 1.0, m/s. Slow on purpose for a first baseline.
    v_max_mps: 0.10
    # Peak angular speed at speed_scale 1.0, rad/s.
    w_max_radps: 0.5

    # Height above grasp/place for pre-grasp, lift, transit and retreat, in metres. Must clear
    # the can top on the way in and the can bottom over the paper edge.
    approach_height_m: 0.08

    # Added to the demos' grasp and place heights, in metres. The demos close at TCP z 0.341,
    # level with the can top (0.207 + 0.135), where the can tapers into its neck; the first
    # live trial squeezed the can out of the fingers there. 3.5 cm lower grips the straight
    # body. Place moves with it, so the can still lands on the paper.
    grasp_height_offset_m: -0.035

    # Offset (x, y) added to the detected can centre to get the TCP grasp xy, in metres.
    # Mined data puts TCP xy at close on the can xy, so zero until perception shows a bias.
    can_xy_bias_m: [0.0, 0.0]

    # --- Goal overrides (collection loop) ---

    # Largest |grasp_dz| a goal may add to grasp and place height, in metres.
    max_grasp_dz_m: 0.02
    # Largest |yaw_offset| a goal may add to the grasp orientation about world z, in radians.
    # 0.35 rad (20 degrees) stays near the demonstrated orientation the IK is known to reach.
    max_yaw_offset_rad: 0.35
    # Largest finger closure a goal may command, in metres. An empty close reads about the
    # closure, so a miss is closure + grasp_missed_threshold_m; a held can reads ~0.0185, and
    # this cap keeps 0.010 + 0.008 below it so a good grasp never counts as missed.
    max_closure_m: 0.010

    # --- Gripper ---

    # Time given to the fingers to close before the grasp check, in seconds.
    close_dwell_s: 1.0
    # Time given to the fingers to release before retreating, in seconds.
    open_dwell_s: 0.8

    # Finger positions commanded open, closed and on the way home, in metres.
    gripper_open_m: 0.05
    gripper_closed_m: 0.0
    gripper_home_m: 0.045

    # Finger position after the close dwell below which the grasp counts as missed. Measured:
    # closed on the can reads ~0.0185, an empty close ~0.0. A goal's closure_width moves an
    # empty close up to that width, so the check becomes closure_width + this threshold.
    grasp_missed_threshold_m: 0.008

    # --- Home ---

    # Pose the run ends at, commanded through /commanded_ee_right (never the arms resetter).
    # Measured home TCP.
    home_position_m: [0.396, -0.185, 0.506]
    home_orientation_xyzw: [0.672, 0.064, 0.736, 0.055]

    # --- Freshness ---

    # Oldest /ee_pose_right or /joint_states sample allowed while commanding, in seconds.
    # Older faults the run into HOLD with STALE_POSE.
    pose_max_age_s: 0.2
    # Oldest can/paper detection accepted at LOCALISE, in seconds. Perception runs at a few
    # Hz; an older pose means it has stopped seeing the object.
    localise_max_age_s: 1.0
