# Chest camera model for the classical baseline: intrinsics plus the fixed mounting on the
# robot body. Read by perception_node (camera_config_file parameter) through
# classical_control.localise.ChestCameraConfig. This is a plain yaml file, not a ROS
# parameter file.
#
# The camera is a UVC fisheye (USB id 1bcf:2d4f) streaming 1920x1080 JPEG. Its driver
# publishes an empty camera_info and no datasheet or published mount exists, so these
# values come from calibrate_chest on fm-rob-01, 2026-10-01: an ArUco marker (id 1, 40 mm)
# on the right gripper's wrist-camera bracket, swept through 15 poses near home; marker in
# 9 views, median corner reprojection 0.80 px, worst view 1.40 px.
#
# Held-out checks, none of them used by the fit:
# - home pose: predicted marker within 2 px horizontally and 34 px vertically of where it
#   was detected (home sits above the sweep, near the image's top edge);
# - offline eval on the 104 demos at the measured table height: paper xy median 20 mm,
#   p90 39 mm; can xy median 12-20 mm where the can was detected correctly.
#
# Re-run `run_classical.sh calibrate` if the camera or its mount is touched.

# Intrinsics at the native 1920x1080 resolution, OpenCV fisheye (equidistant) model.
# The node scales them to its processing resolution with FisheyeCamera.scaled.
intrinsics:
  width: 1920    # px
  height: 1080   # px
  fx: 740.244    # px
  fy: 750.103    # px
  cx: 958.504    # px
  cy: 573.152    # px
  # k1..k4 of cv2.fisheye. k3 and k4 are held at zero: the marker never reaches the image
  # edges, so they cannot be measured.
  distortion: [0.111681, -0.028494, 0.0, 0.0]

# Pose of the camera optical frame (x right, y down, z forward) in the robot body frame.
# Published by perception_node as a static transform parent_frame -> cam_chest_optical.
# On this robot follower_body_link0 coincides with world (identity in the URDF): x forward,
# y left, z up, origin at the bottom of the body base plate.
extrinsic:
  parent_frame: follower_body_link0
  # Lens about 10 cm forward of the body column and 58 cm up, on the centre line.
  translation_xyz: [0.100322, -0.009243, 0.580651]   # m
  # Looking forward and 52.6 deg down, 1.5 deg to the right.
  rotation_xyzw: [-0.665843, 0.673688, -0.231236, 0.222099]
